name: 'Save ccache cache'
description: >-
  Prunes the compilation cache to the entries used in this job, prints statistics and
  saves the full cache (default branch / support/*) or the pull request delta, if the
  build produced enough new cache entries. Older caches of the same kind on the same ref are
  deleted afterwards, which requires the 'actions: write' permission.
  Must run after ccache-prepare in the same job.

inputs:
  github-token:
    description: 'Token used to delete superseded caches'
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - name: Prune cache and show statistics
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/../ccache-common/ccache-gha.sh" fix-ownership
        bash "${GITHUB_ACTION_PATH}/../ccache-common/ccache-gha.sh" evict
        bash "${GITHUB_ACTION_PATH}/../ccache-common/ccache-gha.sh" stats

    - name: Compare with base cache
      id: diff
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../ccache-common/ccache-gha.sh" diff

    - name: Save cache
      id: save
      if: ${{ steps.diff.outputs.save == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.diff.outputs.path }}
        key: ${{ env.CCACHE_GHA_SAVE_KEY }}

    - name: Delete superseded caches
      if: ${{ steps.save.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../ccache-common/ccache-gha.sh" cleanup
